<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Japa Simulator: London Hustle</title>
  <meta name="description" content="A free Sims-style browser game about surviving London. Start as a fresh japa, Old Money or New Gen and hustle your way through 60 days.">
  <meta property="og:title" content="Japa Simulator: London Hustle">
  <meta property="og:description" content="Can you survive 60 days in London? Tube strikes, rent hikes, Owambe parties and visa deadlines.">
  <meta name="theme-color" content="#0f2341">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇬🇧</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <section id="title" class="screen">
    <div class="title-card">
      <p class="eyebrow">A London life sim · free · no download</p>
      <h1>Japa Simulator<span>London Hustle</span></h1>
      <p class="lede">Tube strikes. £7 pints. Visa deadlines. Owambe on Saturday. Can you survive 60 days in London?</p>
      <div class="choices">
        <button class="btn primary big" id="continueBtn">▶ Continue</button>
        <button class="btn big" id="newBtn">✨ New life</button>
      </div>
    </div>
    <svg class="skyline" viewBox="0 0 1200 220" preserveAspectRatio="xMidYMax slice" aria-hidden="true">
      <path fill="#0f2341" d="M0 220 V170 H60 V150 H90 V170 H140 V120 H150 V100 H160 V120 H170 V170 H220 V140 H260 V170
        H300 V60 L310 30 L320 60 V170 H330 V90 H360 V170 H400 V150 H430 V130 H460 V170
        H520 C520 110 560 80 580 60 C600 80 640 110 640 170 H680 V140 H720 V170
        H760 L820 10 L880 170 H920 V120 H960 V170 H1000 V145 H1040 V170 H1080 V110 H1110 V170 H1200 V220 Z"/>
      <circle cx="210" cy="95" r="60" fill="none" stroke="#0f2341" stroke-width="5"/>
      <path stroke="#0f2341" stroke-width="3" d="M210 35 V155 M150 95 H270 M168 53 L252 137 M252 53 L168 137"/>
      <path fill="#0f2341" d="M195 220 L210 160 L225 220 Z"/>
    </svg>
    <div class="bus" aria-hidden="true">🚌</div>
  </section>

  <section id="create" class="screen hidden">
    <div class="create-card">
      <h2>Create your Londoner</h2>
      <div id="create-body"></div>
      <div class="choices">
        <button class="btn" id="backBtn">← Back</button>
        <button class="btn primary big" id="startBtn">Start my London life →</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header id="hud" class="hud"></header>
    <main class="grid">
      <aside id="me" class="panel me"></aside>
      <div class="center">
        <div id="mapwrap" class="panel mapwrap"></div>
        <section class="panel logwrap">
          <h4>Your London story</h4>
          <ol id="log" class="log"></ol>
        </section>
      </div>
      <aside id="place" class="panel place"></aside>
    </main>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div id="modal-card" class="modal-card"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/data.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
