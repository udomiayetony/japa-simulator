<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>London Hustle</title>
  <meta name="description" content="A free 3D browser life sim about surviving London. Start as a Fresh Immigrant, Old Money or New Gen and hustle your way through 60 days.">
  <meta property="og:title" content="London Hustle">
  <meta property="og:description" content="Can you survive 60 days in London? Tube strikes, rent hikes, Owambe parties and visa deadlines.">
  <meta name="theme-color" content="#cfe0b4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="world" class="world"></div>
  <div id="room" class="room hidden"><div class="room-hot" id="roomHot"></div></div>
  <div id="pins" class="pins"></div>

  <section id="title" class="screen">
    <header class="topbar">
      <div class="pill brand"><span class="crown">👑</span><b>London Hustle</b><span class="live"><i class="dot"></i>London life sim</span></div>
      <div class="top-actions"><button class="pill icon music-btn" id="titleMusic" aria-label="Music">🔊</button></div>
    </header>
    <div class="card title-card">
      <h1>Live your London story</h1>
      <p>Tube strikes, £7 pints, visa deadlines and Owambe on Saturday. Can you survive 60 days in London?</p>
      <div class="title-meta"><span>24 neighbourhoods</span><span>60 landmarks</span><span>Trains, bridges &amp; a real calendar</span><span>Free, no download</span></div>
      <div class="row">
        <button class="btn green big" id="newBtn" disabled>Start a new life</button>
        <button class="btn white big hidden" id="continueBtn">Continue</button>
      </div>
      <div class="title-online" id="titleOnline"></div>
    </div>
  </section>

  <section id="create" class="screen hidden">
    <div class="onboard">
      <header class="ob-top">
        <button class="pill icon" id="obBack" aria-label="Back">‹</button>
        <div class="ob-progress"><h2 id="obTitle">Look</h2><span class="ob-dots" id="obDots"></span></div>
        <div class="ob-actions"><button class="pill icon" id="obShuffle" aria-label="Randomise" title="Randomise">🔀</button><button class="btn green" id="obNext">Next</button></div>
      </header>
      <div class="ob-stage" id="obStage"><span class="ob-spin">Drag to spin</span></div>
      <aside class="ob-panel card">
        <div class="ob-body" id="obBody"></div>
        <div class="ob-foot"><button class="btn green big" id="obGo">Continue</button></div>
      </aside>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="pill brand"><span class="crown">👑</span><b>London Hustle</b><span class="live" id="clockPill"></span></div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div class="chips" id="chips"></div>
    <div class="tasks" id="tasks"></div>
    <button class="ticker" id="ticker" aria-label="Open your story"></button>
    <div class="bottom">
      <div class="coach" id="coach"></div>
      <div class="room-bar" id="roomBar"></div>
      <div class="dock" id="dock"></div>
      <section class="sheet card" id="sheet"></section>
      <nav class="bottom-nav" id="nav" aria-label="Main"></nav>
    </div>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div id="modal-card" class="modal-card"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">London Hustle needs JavaScript to run.</p></noscript>
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/",
        "@supabase/supabase-js": "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/+esm"
      }
    }
  </script>
  <script type="module" src="js/boot.js"></script>
</body>
</html>
