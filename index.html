<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>London Hustle</title>
  <meta name="description" content="A free 3D browser life sim about surviving London. Start as a Fresh Immigrant, Old Money or New Gen and hustle your way through 60 days.">
  <meta property="og:title" content="London Hustle">
  <meta property="og:description" content="Can you survive 60 days in London? Tube strikes, rent hikes, Owambe parties and visa deadlines.">
  <meta name="theme-color" content="#cfe0b4">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👑</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <div id="world" class="world"></div>
  <div id="pins" class="pins"></div>

  <section id="title" class="screen">
    <header class="topbar">
      <div class="pill brand"><span class="crown">👑</span><b>London Hustle</b><span class="live"><i class="dot"></i>London life sim</span></div>
    </header>
    <div class="card title-card">
      <h1>Live your London story</h1>
      <p>Tube strikes, £7 pints, visa deadlines and Owambe on Saturday. Can you survive 60 days in London?</p>
      <div class="title-meta"><span>24 neighbourhoods</span><span>40 landmarks</span><span>3 starting lives</span><span>Free, no download</span></div>
      <div class="row">
        <button class="btn green big" id="newBtn">Start a new life</button>
        <button class="btn white big" id="continueBtn">Continue</button>
      </div>
    </div>
  </section>

  <section id="create" class="screen hidden">
    <div class="card create-card">
      <h2>Create your Londoner</h2>
      <div id="create-body"></div>
      <div class="row end">
        <button class="btn white" id="backBtn">Back</button>
        <button class="btn green big" id="startBtn">Start my London life</button>
      </div>
    </div>
  </section>

  <section id="game" class="screen hidden">
    <header class="topbar">
      <div class="pill brand"><span class="crown">👑</span><b>London Hustle</b><span class="live" id="clockPill"></span></div>
      <div class="top-actions" id="topActions"></div>
    </header>
    <div class="chips" id="chips"></div>
    <button class="ticker" id="ticker" aria-label="Open your story"></button>
    <div class="bottom">
      <div class="dock" id="dock"></div>
      <section class="sheet card" id="sheet"></section>
    </div>
  </section>

  <div id="modal" class="modal hidden" role="dialog" aria-modal="true"><div id="modal-card" class="modal-card"></div></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="js/boot.js"></script>
</body>
</html>
